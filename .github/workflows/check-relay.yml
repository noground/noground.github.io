name: Check relay connectivity
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-relay.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check service health
        run: |
          curl --connect-timeout 10 --max-time 100 --fail --show-error --silent --write-out '\nHTTP %{http_code} duration %{time_total}\n' https://two-little-shops-relay.onrender.com/health
      - name: Check public menu
        run: |
          curl --connect-timeout 10 --max-time 45 --fail --show-error --silent -H 'Origin: https://noground.github.io' -H 'Content-Type: text/plain' --data-binary '{"path":"boot","method":"GET"}' https://two-little-shops-relay.onrender.com/api/github -o /tmp/public-menu.json
          node -e "const d=require('/tmp/public-menu.json'); if(!Array.isArray(d.dishes)) process.exit(1); console.log(JSON.stringify({dishes:d.dishes.length,canManage:d.canManage}));"
