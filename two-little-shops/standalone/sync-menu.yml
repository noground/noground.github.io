name: Sync public menu
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-menu.yml
      - two-little-shops/scripts/sync-menu-snapshot.mjs
permissions:
  contents: write
  pages: write
concurrency:
  group: sync-public-menu
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: published
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Download public menu and images
        run: node source/two-little-shops/scripts/sync-menu-snapshot.mjs https://two-little-shops.wudi09711-shops.workers.dev published
      - name: Publish menu changes
        working-directory: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add menu-snapshot.json menu-photos
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync public menu and images"
          git push origin HEAD:gh-pages
          gh api --method POST repos/noground/noground.github.io/pages/builds
