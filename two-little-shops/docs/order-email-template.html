<!doctype html>
<html lang="zh-CN"><body style="margin:0;background:#f5f4ed;font-family:Arial,'Microsoft YaHei',sans-serif;color:#344539">
<main style="max-width:580px;margin:24px auto;padding:28px;background:#fffdf7;border-radius:16px">
 <p style="color:#7b8b6d;font-size:12px;letter-spacing:2px">两人一起 · 好好吃饭</p>
 <h1 style="font-size:24px;margin:12px 0 20px">{{subject}}</h1>
 <p>点餐人：<strong>{{nickname}}</strong></p>
 <p>下单时间：{{ordered_at}}</p>
 <p>订单尾号：{{order_number}}</p>
 <div style="padding:16px;background:#edf2e7;border-radius:12px;white-space:pre-wrap;line-height:1.9">{{order_summary}}</div>
 <p style="line-height:1.8">留言：{{order_note}}</p>
 <p>本店参考合计：<strong>{{order_total}}</strong></p>
 <p style="margin-top:24px"><a href="{{manage_url}}" style="display:inline-block;padding:12px 20px;background:#48664c;color:#fff;text-decoration:none;border-radius:10px">看看这份订单</a></p>
 <p style="font-size:11px;color:#8a9184;margin-top:24px">完整订单编号：{{order_id}}<br>邮件仅作新订单提醒，不代表已经完成制作。</p>
</main>
</body></html>
